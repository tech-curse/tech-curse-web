name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalação
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Testes unitários
        run: npm run test:cobertura

      - name: Cobertura
        run: node scripts/resumo-cobertura.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Rastreabilidade
        if: ${{ !cancelled() }}
        run: node scripts/rastreabilidade.mjs --estrito >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WEB_IMAGE: tech-curse-web:ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.WEB_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar o contêiner
        run: scripts/verificar-conteiner.sh

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalação
        run: npm ci --no-audit --no-fund

      - name: Navegador
        run: npx playwright install --with-deps chromium

      - name: Subir a imagem
        run: docker run --detach --name web-e2e --publish 127.0.0.1:8080:8080 "$WEB_IMAGE"

      - name: Testes end-to-end contra a imagem
        env:
          E2E_URL: http://127.0.0.1:8080
        run: npm run e2e

      - name: Logs do contêiner
        if: ${{ failure() }}
        run: docker logs web-e2e

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7
