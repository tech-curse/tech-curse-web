name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalação
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Testes unitários
        run: npm run test:cobertura

      - name: Cobertura
        run: node scripts/resumo-cobertura.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Rastreabilidade
        if: ${{ !cancelled() }}
        run: node scripts/rastreabilidade.mjs --estrito >> "$GITHUB_STEP_SUMMARY"

  espelho:
    name: espelho
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Espelhar as imagens base no GHCR
        run: scripts/imagens-base.sh espelhar

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [espelho]
    permissions:
      contents: read
      packages: read
    env:
      WEB_IMAGE: tech-curse-web:ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: imagens-base
        name: Imagens base do espelho
        run: |
          {
            echo "contextos<<FIM"
            scripts/imagens-base.sh contextos
            echo "FIM"
          } >> "$GITHUB_OUTPUT"

      - name: Build da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: ${{ steps.imagens-base.outputs.contextos }}
          load: true
          tags: ${{ env.WEB_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar o contêiner
        run: scripts/verificar-conteiner.sh

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalação
        run: npm ci --no-audit --no-fund

      - name: Navegador
        run: npx playwright install --with-deps chromium

      - name: Subir a imagem
        run: docker run --detach --name web-e2e --publish 127.0.0.1:8080:8080 "$WEB_IMAGE"

      - name: Testes end-to-end contra a imagem
        env:
          E2E_URL: http://127.0.0.1:8080
        run: npm run e2e

      - name: Logs do contêiner
        if: ${{ failure() }}
        run: docker logs web-e2e

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7

  publicar:
    name: publicar
    if: ${{ github.event_name == 'push' }}
    needs: [ci, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Versão da tag igual à do projeto
        if: ${{ github.ref_type == 'tag' }}
        run: |
          versao=$(node -p "require('./package.json').version")
          [ "v$versao" = "$GITHUB_REF_NAME" ] || { echo "A tag $GITHUB_REF_NAME não corresponde à versão $versao do package.json"; exit 1; }

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadados
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}

      - id: imagens-base
        name: Imagens base do espelho
        run: |
          {
            echo "contextos<<FIM"
            scripts/imagens-base.sh contextos
            echo "FIM"
          } >> "$GITHUB_OUTPUT"

      - id: publicacao
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: ${{ steps.imagens-base.outputs.contextos }}
          push: true
          tags: ${{ steps.metadados.outputs.tags }}
          labels: ${{ steps.metadados.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publicacao.outputs.digest }}
          push-to-registry: true

      - name: Resumo
        run: |
          {
            echo "## Imagem publicada"
            echo
            echo "${{ steps.metadados.outputs.tags }}" | sed 's/^/- `/; s/$/`/'
            echo "- digest: \`${{ steps.publicacao.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
