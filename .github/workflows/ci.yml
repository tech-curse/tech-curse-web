name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalação
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Testes unitários
        run: npm run test:cobertura

      - name: Cobertura
        run: node scripts/resumo-cobertura.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Rastreabilidade
        if: ${{ !cancelled() }}
        run: node scripts/rastreabilidade.mjs >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalação
        run: npm ci --no-audit --no-fund

      - name: Navegador
        run: npx playwright install --with-deps chromium

      - name: Testes end-to-end
        run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7
